# WeUp Career — development stack (ADR-006).
# `docker compose up` starts the backend; migrations run on container start.
# Copy backend/.env.example → backend/.env (or set SECRET_KEY / [CRED_BD3FC6A6]
# below) before first run.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: weup-career-backend:dev
    env_file:
      - ./backend/.env
    environment:
      # Container path for the SQLite file on the persistent volume.
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      ENVIRONMENT: development
      LOG_LEVEL: info
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  backend_data:
