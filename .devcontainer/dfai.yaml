# =============================================================================
# DFAI anonymization config — weup
# =============================================================================
# DFAI scans declared paths/env-vars at startup, masks matching values in every
# outgoing Claude API call, and hot-reloads on change. This file is SAFE TO
# COMMIT — it contains only paths and key NAMES, never actual secret values.
#
# This is a slim opinionated starter. For the full reference (custom regex
# patterns, GitHub-org allowlists, per-directory file-size caps, etc.):
#
#   docker compose exec dev cat /opt/dfai/dfai.yaml.example
#
# Runtime knobs are env vars in docker-compose.yml, NOT in this file:
#   DFAI_ENABLED            master switch (default: 1)
#   DFAI_DETECT_COMMANDS    scan responses for dangerous shell (default: true)
#   DFAI_DETECT_INJECTIONS  scan requests for prompt injections (default: true)
#   DFAI_RETENTION_DAYS     audit log retention (default: 90, 0 = forever)
#   ENGAGEMENT_ID           per-engagement vault isolation key
# =============================================================================

protected:
  # ── Directories scanned for secrets (recursive) ───────────────────────────
  # Extraction strategy auto-detected per file extension:
  #   .env/.conf/.ini       → key=value extraction
  #   .yaml/.json/.toml     → flatten key-path extraction
  #   .pem/.key/.crt        → whole file as one secret
  #   .lic/.license         → each line as a separate secret
  #   .go/.py/.ts/.js       → regex pattern extraction
  directories:
    - path: confidential/         # commit .gitkeep, drop secret files here
      recursive: true
      include: ["*.yaml", "*.yml", "*.env", "*.key", "*.pem", "*.lic", "*.license", "*.crt"]
      exclude: ["vendor/**", "node_modules/**", "*_test.*", "*.example"]
      cache: true

  # ── Specific files (paths inside the container) ──────────────────────────
  files:
    # Workspace .env (if any) — values masked
    - path: .env
      strategy: values

    # Workspace dfai.yaml is NOT scanned (this file declares only key names)

    # SSH private keys — whole file = one secret (multiline PEM block)
    - path: /home/administrator/.ssh/id_rsa
      strategy: raw
    - path: /home/administrator/.ssh/id_ed25519
      strategy: raw

    # Common credential files in $HOME
    - path: /home/administrator/.netrc
      strategy: values
    - path: /home/administrator/.npmrc
      strategy: values
    - path: /home/administrator/.pypirc
      strategy: values

    # Cloud provider config
    - path: /home/administrator/.aws/credentials
      strategy: values
    - path: /home/administrator/.kube/config
      strategy: values

  # ── Container env vars ───────────────────────────────────────────────────
  # Prefer EXPLICIT prefixes/keys over `all: true`. Loading every env var
  # blindly seeds non-secret values (CMD, NODE_ENV, GOPATH, ...) as
  # CREDENTIAL, which then surrogate-replaces the words anywhere they
  # appear in source code — catastrophic for code review.
  #
  # Sensible defaults: anything whose name looks credential-ish gets seeded.
  # Add your own org-specific prefixes (e.g. ACME_SECRET_*) below.
  env:
    prefixes:
      - ANTHROPIC          # ANTHROPIC_API_KEY etc.
      - GITHUB             # GITHUB_TOKEN, GITHUB_PAT
      - GITLAB             # GITLAB_TOKEN
      - AWS                # AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      - GCP                # GCP_*
      - AZURE              # AZURE_*
      - DOCKER             # DOCKER_PASSWORD, DOCKER_TOKEN
      - NPM                # NPM_TOKEN
      - PYPI               # PYPI_TOKEN
    keys:
      # GUI / VNC credentials auto-generated by initialize.sh per project —
      # always seed so they're redacted on any accidental log / API leak.
      - WEB_AUTHENTICATION_USERNAME
      - WEB_AUTHENTICATION_PASSWORD
      - VNC_PASSWORD
      # Common app-side credential env var names (case-sensitive)
      - DATABASE_URL
      - DATABASE_PASSWORD
      - POSTGRES_PASSWORD
      - MYSQL_PASSWORD
      - REDIS_PASSWORD
      - SECRET_KEY
      - JWT_SECRET
      - SESSION_SECRET
      - API_KEY
      - ENCRYPTION_KEY
    exclude: []
    # DFAI bakes a defensive _SYSTEM_EXCLUDE that already covers every var
    # declared in this devcontainer's docker-compose.yml (PATH, TZ, LANG,
    # USER_ID, BACKEND_PORT, ANTHROPIC_BASE_URL, KUBECONFIG, all DFAI_*,
    # CLAUDE_*, WEB_AUTHENTICATION_USERNAME, GUI knobs, Go/Node/pnpm
    # toolchain paths, etc.). Add your own infra vars here if you adopt
    # `all: true` and have stack-specific non-secret env vars.
    # all: true                   # ← uncomment ONLY if your stack stores
    #                               secrets in env vars without a naming
    #                               convention. Pairs with DFAI's value-
    #                               quality filter to suppress code-word noise.

# ── Allowlist — trusted destinations (NOT anonymized) ────────────────────────
# Match types: domain (fnmatch), ip, cidr, org_repo (fnmatch), regex.
# All entries default to policy: bypass. SAFETY: any allowlist exception is
# treated as "value is protected" — a misconfigured allowlist cannot leak.

allowlist:
  # AI / model APIs
  - { name: anthropic,         domain: "*.anthropic.com" }
  - { name: openai_api,        domain: "api.openai.com" }

  # Code hosts
  - { name: github,            domain: "*.github.com" }
  - { name: github_raw,        domain: "raw.githubusercontent.com" }
  - { name: gitlab,            domain: "*.gitlab.com" }

  # Package registries
  - { name: npm_registry,      domain: "registry.npmjs.org" }
  - { name: pypi,              domain: "pypi.org" }
  - { name: pypi_files,        domain: "files.pythonhosted.org" }
  - { name: docker_hub,        domain: "*.docker.io" }
  - { name: docker_ghcr,       domain: "ghcr.io" }
  - { name: rust_crates,       domain: "crates.io" }
  - { name: rust_crates_static,domain: "static.crates.io" }
  - { name: go_proxy,          domain: "*.golang.org" }
  - { name: go_sum,            domain: "sum.golang.org" }

  # OS / distro
  - { name: ubuntu_archive,    domain: "archive.ubuntu.com" }
  - { name: ubuntu_security,   domain: "security.ubuntu.com" }
  - { name: debian,            domain: "*.debian.org" }
  - { name: alpine,            domain: "*.alpinelinux.org" }

  # Cloud SDKs
  - { name: google_apis,       domain: "*.googleapis.com" }
  - { name: aws_endpoints,     domain: "*.amazonaws.com" }
  - { name: azure,             domain: "*.azure.com" }

  # ── Add your trusted internal endpoints below ────────────────────────────
  # - { name: internal_mgmt,   cidr: "10.0.0.0/8" }
  # - { name: my_org_repos,    org_repo: "github.com/my-org/**" }
  # - { name: k8s_internal_dns,regex: '\.svc\.cluster\.local$' }

# ── Custom detection patterns (extends built-in regex set) ───────────────────
# Hot-reloaded. Use entity_type to control the surrogate category in audit log.
# IMPORTANT: leave the `[]` defaults below. A bare YAML key (`custom_patterns:`
# with no items) parses as `None` — DFAI tolerates that defensively, but `[]`
# is explicit and survives any version that doesn't.
#
# A baked-in default allowlist already trusts common tech acronyms (HTTP/MIT/
# AWS/CLI/JWT/OIDC/...), public docs domains (github.com / anthropic.com /
# kubernetes.io / etc.), and RFC1918 + loopback IPs. Set
# DFAI_NO_DEFAULT_ALLOWLIST=1 in .env to opt out. To extend the allowlist
# with your project's own jargon / public repos / VPN ranges, add entries to
# `allowlist:` above (domain / ip / cidr / org_repo / regex).
detect:
  custom_patterns: []
    # - name: internal_session_token
    #   regex: 'sess_[A-Za-z0-9]{32}'
    #   entity_type: TOKEN

  allow_patterns: []
    # Suppress test-fixture false positives — anchor your regex carefully.
    # - name: jest_assertion
    #   regex: 'expect\(.*\)\.toBe'
    # - name: docs_placeholder_ip
    #   regex: '^192\.0\.2\.\d+$'

# ── Identifier protection — ALWAYS masked, regardless of DETECT_MODE ────────
# Project-specific tokens you want redacted from every outbound Claude API
# call, even under the default `secrets-only` mode. Tagged BRAND in audit log.
#   brands  — case-insensitive whole-word match (product / project / customer
#             names). "AcmeCorp" → also masks "acmecorp", " AcmeCorp."
#   domains — bare domain + ALL subdomains + emails @ them.
#             "acme.com" → www.acme.com, alice@acme.com, alice@x.acme.com.
# Both default to []. Hot-reloaded on file change.
protect_identifiers:
  brands: 
     - SoC.one
     - Fv.media
     - Socone
     - Fvmedia
     - FederateGroup
     - Synopsys
     - Orion
     - Omicom
     - Fora
     - SimX
     - CloudFabric
     - Loom
     - Audi
     - Sony
     - Toyota
     - BMW
     - Volkswagen
     - Arm
     - Infineon
     - VDK
     - eDT
     - IPG
     - Carmaker
     - Hieu Tran
     - htran
     - Lap Ngo
     - lapd
     - Lap Ngo Doan
  domains: 
    - viosoft.com
    - soc.one
    - fv.media
    - hn.soc.one
    - dn.soc.one
    - synopsys.com
    - orion.com
