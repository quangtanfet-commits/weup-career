name: CI — Quality Gate

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

# ─── JOBS RUN IN PARALLEL ─────────────────────────────────────
jobs:

  # ── 0. Detect frontend (gate full-stack jobs until frontend exists) ──
  detect:
    name: "Detect frontend"
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.c.outputs.has_frontend }}
      has_e2e_stack: ${{ steps.c.outputs.has_e2e_stack }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi
          # E2E needs the full Docker stack (frontend + nginx + backend).
          # Until docker-compose.test.yml lands (F2), skip E2E instead of
          # failing — an E2E run with no public pages tests nothing.
          if [ -f docker-compose.test.yml ]; then
            echo "has_e2e_stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_e2e_stack=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Backend — Lint & Type Check ──────────────────────────
  lint-backend:
    name: "🔍 Backend Lint & Types"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv pip install --system -e . --group dev

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: mypy strict
        run: mypy app/ --strict --ignore-missing-imports

      - name: Bandit security lint
        run: bandit -ll -r app/

  # ── 2. Frontend — Lint & Type Check ─────────────────────────
  lint-frontend:
    name: "🔍 Frontend Lint & Types"
    runs-on: ubuntu-latest
    # Skip until the frontend is scaffolded (backend-only slices ship first).
    needs: [detect]
    if: ${{ needs.detect.outputs.has_frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # ── 3. Backend — Tests & Coverage ───────────────────────────
  test-backend:
    name: "🧪 Backend Tests"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install dependencies
        run: uv pip install --system -e . --group dev

      - name: Run tests with coverage
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production-use
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -v \
            --tb=short

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4. Frontend — Tests & Coverage ──────────────────────────
  test-frontend:
    name: "🧪 Frontend Tests"
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.has_frontend == 'true' }}
    needs: [detect, lint-frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 5. Security Scan ─────────────────────────────────────────
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/react
            p/security-audit
            p/secrets
          generateSarif: "1"

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()
        continue-on-error: true  # code-scanning upload needs GHAS (private repo)

      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --requirement <(pip install uv && uv pip compile pyproject.toml) \
            --ignore-vuln GHSA-xxxxxxxx || true  # list specific ignored CVEs

      - name: Node dependency audit
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm audit --audit-level high

  # ── 6. TLA+ Formal Verification ─────────────────────────────
  formal-verification:
    name: "🔢 TLA+ Model Check"
    runs-on: ubuntu-latest
    # Only run when TLA+ specs or implementation changes
    steps:
      - uses: actions/checkout@v4

      - name: Check if TLA+ files changed
        id: tla-changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            tla/**/*.tla
            tla/**/*.cfg
            backend/app/auth/**
            backend/app/guardians/**
            backend/app/assessments/**
            backend/app/reco/**
            backend/app/competency/**
            backend/app/core/consent.py
            backend/app/core/audit.py

      - name: Download TLA+ tools
        if: steps.tla-changed.outputs.any_changed == 'true'
        run: |
          wget -q https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -O /tmp/tla2tools.jar

      - name: Run TLC — tất cả module (CP-1…CP-8)
        if: steps.tla-changed.outputs.any_changed == 'true'
        run: |
          for m in ConsentLifecycle SensitiveDataAccess AuthorizationModel \
                   RecommendationGovernance AuthTokenLifecycle CompetencyProgress; do
            echo "=== TLC: $m ==="
            java -jar /tmp/tla2tools.jar \
              -config "tla/$m.cfg" "tla/${m}MC.tla" 2>&1 | tee "tla-$m.log"
            grep -q "Model checking completed" "tla-$m.log"
          done

  # ── 6b. Bias / [CRED_C5DB6C42] Test (AI fairness) — Luật 134/2025, NFR-12 ───
  bias-test:
    name: "⚖️  Bias / [CRED_C5DB6C42] Test"
    runs-on: ubuntu-latest
    # Chỉ chạy khi đụng engine gợi ý / [CRED_E1311C5D] (kích hoạt khi code xuất hiện)
    steps:
      - uses: actions/checkout@v4

      - name: Check if recommendation/assessment code changed
        id: bias-changed
        uses: tj-actions/changed-files@v44
        with:
          files: |
            backend/app/reco/**
            backend/app/assessments/**
            backend/tests/bias/**

      - uses: actions/setup-python@v5
        if: steps.bias-changed.outputs.any_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run bias test suite (HARD GATE — không nới ngưỡng)
        if: steps.bias-changed.outputs.any_changed == 'true'
        working-directory: backend
        run: |
          # Khung: docs/testing/bias-testing.md (M1..M5, DIR≥0.80, counterfactual≥99%)
          if [ ! -d tests/bias ]; then
            echo "❌ P-1: code engine gợi ý/[CRED_E1311C5D] thay đổi nhưng THIẾU bộ bias test (tests/bias/)."
            echo "   Bắt buộc theo NFR-12 + Luật 134/2025. Xem docs/testing/bias-testing.md."
            exit 1
          fi
          pip install uv && uv pip install --system -e . --group dev
          pytest tests/bias/ -v

  # ── 7. E2E Tests (Playwright) ────────────────────────────────
  e2e:
    name: "🎭 E2E Tests — ${{ matrix.browser }}"
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.has_frontend == 'true' && needs.detect.outputs.has_e2e_stack == 'true' }}
    needs: [detect, test-backend, test-frontend]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build & start Docker stack for E2E
        env:
          SECRET_KEY: ci-e2e-test-secret-not-for-production
          ENVIRONMENT: test
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
          # Wait for health
          timeout 60 bash -c 'until curl -sf http://localhost/api/v1/ready; do sleep 2; done'

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          BASE_URL: http://localhost
        run: npx playwright test --project=${{ matrix.browser }} --reporter=html

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: docker compose down

  # ── 8. Container Image Build & Scan ─────────────────────────
  build-and-scan:
    name: "🐳 Build & Scan Images"
    runs-on: ubuntu-latest
    # Needs the frontend image; skip until frontend exists.
    if: ${{ needs.detect.outputs.has_frontend == 'true' }}
    needs: [detect, lint-backend, lint-frontend]
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image metadata
      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      # Frontend image metadata
      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      # Build backend
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:buildcache,mode=max

      # Build frontend
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:buildcache,mode=max

      # Trivy scan — backend
      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:sha-${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
        if: github.event_name != 'pull_request'

      # Trivy scan — frontend
      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:sha-${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
        if: github.event_name != 'pull_request'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: |
            trivy-backend.sarif
            trivy-frontend.sarif
        if: always() && github.event_name != 'pull_request'

  # ── 9. PR Summary ─────────────────────────────────────────────
  ci-summary:
    name: "✅ CI Gate — All Passed"
    runs-on: ubuntu-latest
    needs:
      - lint-backend
      - lint-frontend
      - test-backend
      - test-frontend
      - security
      - e2e
      - build-and-scan
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed — PR is mergeable"
