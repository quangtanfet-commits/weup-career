# =============================================================================
# weup — Devcontainer compose (slim template)
# =============================================================================
# All variables have defaults so .env is OPTIONAL. The bundled
# scripts/initialize.sh auto-generates .env on first run with random GUI/VNC
# passwords; edit/override there if you want, or just delete .env and let it
# regenerate.
#
# What gets baked into the image vs ships in this template:
#   IMAGE  (tanweup/darkforge:v1.0.0)
#     - post-create / post-start runtime scripts  → /usr/local/bin/devcontainer-*.sh
#     - DFAI proxy, DinD, k3s, openbox, GUI fixes, Specula, Dark Factory skills
#   TEMPLATE  (this dir)
#     - devcontainer.json, this file, scripts/initialize.sh
#     - (optional) scripts/post-{create,start}-hook.sh for per-project bootstrap
# =============================================================================
name: ${PROJECT_NAME:-weup}

services:
  dev:
    image: ${DARKFORGE_IMAGE:-tanweup/darkforge:v1.0.0}
    networks:
      - dev-net
    # Embedded dockerd + k3s require privileged + cgroup: host.
    privileged: true
    cgroup: host
    #healthcheck:
      # Layered probe:
      #   1. administrator user must exist (jlesage cont-init completed).
      #   2. If DFAI is enabled, /health must respond AND not be degraded.
      # Compose-level `restart:` is intentionally "no" (further down in this
      # file) to avoid masking postCreate crashes. DFAI recovery is handled
      # IN-CONTAINER by service-run.sh's watchdog → s6. So this healthcheck
      # is informational (visible via `docker compose ps`) — external
      # orchestrators (k8s, swarm) can recreate on degraded; bare compose
      # surfaces the status without auto-recreating.
      # test:
      #   - "CMD-SHELL"
      #   - |
      #     getent passwd administrator | grep -q /home/administrator || exit 1
      #     if [ "$${DFAI_ENABLED:-1}" = "1" ]; then
      #       body=$$(curl -sf -m 3 http://127.0.0.1:$${DFAI_PORT:-1080}/health 2>/dev/null) || exit 1
      #       echo "$$body" | grep -q '"status":"ok"' || exit 1
      #     fi
      #     exit 0
      # interval: 30s
      # timeout: 10s
      # start_period: 120s
      # retries: 5
    # Two-level .env layering — all optional:
    #
    #   1) ../.env (project root)   ← YOUR APP'S env (DATABASE_URL, API_KEY,
    #                                  NODE_ENV, ...). Loaded FIRST.
    #   2) ./.env  (devcontainer)   ← Auto-generated by initialize.sh —
    #                                  GUI/VNC passwords, tool version pins,
    #                                  infra knobs. Loaded LAST so
    #                                  devcontainer-managed values take
    #                                  precedence over app env on overlap.
    #
    # Note: env_file: loads variables INTO the container at runtime. It does
    # NOT contribute to ${VAR} substitution in this compose YAML — for that,
    # Compose only reads .env adjacent to the compose file (./.env). If you
    # need root-.env values substituted into THIS file, invoke compose with
    # `--env-file ../.env` (the VS Code Dev Containers extension does not).
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    hostname: ${PROJECT_NAME:-weup}
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Locale — image bakes en_US.UTF-8; override here if your stack prefers
      # another locale (run `locale -a` inside the container for the list).
      LANG: ${LANG:-en_US.UTF-8}
      LC_ALL: ${LC_ALL:-en_US.UTF-8}
      LANGUAGE: ${LANGUAGE:-en_US:en}
      APP_NAME: "${APP_NAME:-${PROJECT_NAME:-weup}}"
      # MUST be exposed inside the container — post-start.sh / post-create.sh
      # / devcontainer-user-bootstrap.sh all `cd "/home/administrator/$PROJECT_NAME"`
      # and locate CLAUDE.md there. Without this, `ruflo init` runs in
      # /home/administrator/ and the CLAUDE.skills.md sentinel never reaches
      # the project's CLAUDE.md.
      PROJECT_NAME: ${PROJECT_NAME:-weup}
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
      GIT_SSH_PORT: ${GIT_SSH_PORT:-22}
      BACKEND_PORT: ${BACKEND_PORT:-8091}
      # ── GUI (noVNC) — credentials generated by initialize.sh ─────────
      SECURE_CONNECTION: "${SECURE_CONNECTION:-1}"
      WEB_AUTHENTICATION: "${WEB_AUTHENTICATION:-1}"
      WEB_AUTHENTICATION_USERNAME: "${WEB_AUTHENTICATION_USERNAME:-admin}"
      WEB_AUTHENTICATION_PASSWORD: "${WEB_AUTHENTICATION_PASSWORD:-}"
      WEB_LISTENING_PORT: ${VNC_PORT:-5800}
      VNC_PASSWORD: "${VNC_PASSWORD:-}"
      WEB_FILE_MANAGER: "${WEB_FILE_MANAGER:-0}"
      WEB_TERMINAL: "${WEB_TERMINAL:-0}"
      WEB_AUDIO: "${WEB_AUDIO:-0}"
      WEB_NOTIFICATION: "${WEB_NOTIFICATION:-0}"
      WEB_FILE_MANAGER_DENIED_PATHS: "/home/administrator/${PROJECT_NAME:-weup}"
      # CRITICAL — jlesage baseimage generates /config/webauth-htpasswd and
      # /config/certs/*.pem at first start. Without TAKE_CONFIG_OWNERSHIP=1
      # those files keep their initial owner (host UID via bind mount) and
      # the in-container webauth/nginx services fail with:
      #   webauth: FATAL: could not open password database ... permission denied
      #   nginx: cannot load certificate key ... permission denied
      # Setting this to 1 makes baseimage chown -R /config to USER_ID/GROUP_ID
      # at every boot so the GUI stack can always read its own state files.
      TAKE_CONFIG_OWNERSHIP: "1"
      # ── Toolchain knobs ──────────────────────────────────────────────
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=4096}
      GOPATH: ${GOPATH:-/home/administrator/go}
      GOTOOLCHAIN: ${GOTOOLCHAIN:-auto}
      # Persistent state redirects — these MUST point at the HOME-rooted
      # paths that are bind-mounted to ~/.myclaude/_shared/ on the host, or
      # else `npm install -g` (including the post-start auto-update of
      # claude-code + ruflo) writes to /usr/local/lib/node_modules and
      # vanishes on every container recreate. Same logic for pnpm + Go.
      NPM_CONFIG_PREFIX: /home/administrator/.npm-global
      PNPM_HOME: /home/administrator/.local/share/pnpm
      GOMODCACHE: /home/administrator/go/pkg/mod
      GOCACHE: /home/administrator/.cache/go-build
      # Persistent bin dirs first so user-installed tools win over baked.
      PATH: /home/administrator/.npm-global/bin:/home/administrator/.local/share/pnpm:/home/administrator/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # ── Auto-update on container start (post-start.sh) ───────────────
      # SKIP_AUTO_UPDATE=1   → skip the npm pull entirely (offline / CI)
      # CLAUDE_CODE_VERSION  → pin instead of @latest
      # RUFLO_VERSION        → pin instead of @latest
      SKIP_AUTO_UPDATE: ${SKIP_AUTO_UPDATE:-0}
      CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
      RUFLO_VERSION: ${RUFLO_VERSION:-}
      # ── Claude Code config persistence ────────────────────────────────
      # Pin Claude Code to write its config + .credentials.json INTO the
      # bind-mounted ~/.claude/ dir (per-project, persisted to
      # ~/.myclaude/<project>/ on the host). Without this, recent Claude
      # Code versions may fall back to ~/.config/claude/ — which is NOT
      # bind-mounted — and the login token vanishes on container recreate.
      # Effect: log in once per project, survives `Rebuild Container`.
      CLAUDE_CONFIG_DIR: /home/administrator/.claude
      CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS: "1"
      DISABLE_AUTOUPDATER: "0"
      # ── DFAI proxy (runs at localhost:1080 inside the container) ─────
      ANTHROPIC_BASE_URL: "http://localhost:1080"
      ENGAGEMENT_ID: ${ENGAGEMENT_ID:-${PROJECT_NAME:-weup}}
      DFAI_CONFIG: /home/administrator/${PROJECT_NAME:-weup}/.devcontainer/dfai.yaml
      DFAI_PORT: ${DFAI_PORT:-1080}
      DFAI_ENABLED: ${DFAI_ENABLED:-1}
      # Detection scope. Primary purpose of DFAI is to stop SECRETS from
      # leaking — not to anonymize every common word. Modes:
      #   secrets-only (default) → TOKEN / CREDENTIAL / PRIVATE_KEY / API_KEY
      #                            / PASSWORD only. Code-review safe.
      #   pii                    → secrets + EMAIL_ADDRESS.
      #   pentest                → also USERNAME / HOSTNAME / ORGANIZATION /
      #                            DOMAIN / URL / IDENTIFIER / HASH — only
      #                            correct when the input is pentest tool
      #                            output (CME / BloodHound / SAM dumps).
      DFAI_DETECT_MODE: ${DFAI_DETECT_MODE:-secrets-only}
      # ── DinD / k3s ───────────────────────────────────────────────────
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      DOCKER_HOST: unix:///var/run/docker.sock
    working_dir: /home/administrator/${PROJECT_NAME:-weup}
    # ── DO NOT add `user:` here ─────────────────────────────────────────────
    # jlesage's baseimage-gui REQUIRES the container to start as ROOT so its
    # /etc/cont-init.d/*.sh scripts can:
    #   • mkdir /.docker-instance        (05-container-instance-uuid.sh)
    #   • chown -R /config to USER_ID    (10-take-config-ownership.sh)
    #   • create /etc/profile.d entries  (DFAI, DinD, dind-user.sh)
    #   • generate webauth-htpasswd      (10-webauth.sh — needs root for htpasswd file)
    #
    # jlesage automatically drops privileges to administrator (UID = USER_ID,
    # GID = GROUP_ID env vars set above) AFTER cont-init finishes, via
    # s6-setuidgid wrappers around each long-running service.
    #
    # VS Code uses devcontainer.json `"remoteUser": "administrator"` for
    # interactive shells — that's the correct knob and does NOT override
    # the container's startup user.
    #
    # Adding `user: "administrator"` here breaks the entire init chain:
    #   05-container-instance-uuid.sh: mkdir /.docker-instance: Permission denied
    #   webauth: FATAL: could not open password database ... permission denied
    #   nginx: cannot load certificate key ... permission denied
    volumes:
      # Project source — mount this devcontainer's parent at expected path.
      - type: bind
        source: ..
        target: /home/administrator/${PROJECT_NAME:-weup}
        consistency: delegated
      # Per-project Claude state (isolated across projects).
      - type: bind
        source: ${HOME}/.myclaude/${PROJECT_NAME:-weup}
        target: /home/administrator/.claude
        consistency: cached
      - type: bind
        source: ${HOME}/.myclaude/${PROJECT_NAME:-weup}/share
        target: /home/administrator/.local/share/claude
        consistency: cached
      - type: bind
        source: ${HOME}/.myclaude/${PROJECT_NAME:-weup}/claude-flow
        target: /home/administrator/.claude-flow
        consistency: cached
      # Belt-and-suspenders: some Claude Code versions ignore CLAUDE_CONFIG_DIR
      # and fall back to XDG_CONFIG_HOME (~/.config/claude). Bind that too so
      # login persists regardless of which path Claude picks.
      - type: bind
        source: ${HOME}/.myclaude/${PROJECT_NAME:-weup}/config-claude
        target: /home/administrator/.config/claude
        consistency: cached
      # SSH — writable so:
      #   - ssh client can append to known_hosts (StrictHostKeyChecking=accept-new
      #     or interactive "yes")
      #   - ssh-keyscan / Git tooling can update known_hosts in-place (some
      #     SSH builds write known_hosts.new then rename, which needs a
      #     writable parent dir)
      #   - new private keys / config edits don't require a rebuild
      # Keys stay protected by their own file mode (id_* should be 0600 on host).
      - type: bind
        source: ${HOME}/.ssh/devcontainer
        target: /home/administrator/.ssh
        consistency: cached
      # noVNC GUI state.
      - type: bind
        source: ${HOME}/.myclaude-gui/${PROJECT_NAME:-weup}
        target: /config
        consistency: cached
      # Shared (cross-project) tool caches.
      - type: bind
        source: ${HOME}/.myclaude/_shared/npm-global
        target: /home/administrator/.npm-global
        consistency: cached
      - type: bind
        source: ${HOME}/.myclaude/_shared/npm-cache
        target: /home/administrator/.npm
        consistency: cached
      - type: bind
        source: ${HOME}/.myclaude/_shared/pnpm-store
        target: /home/administrator/.local/share/pnpm
        consistency: cached
      - type: bind
        source: ${HOME}/.myclaude/_shared/go
        target: /home/administrator/go
        consistency: cached
      - type: bind
        source: ${HOME}/.myclaude/_shared/cache
        target: /home/administrator/.cache
        consistency: cached
      # DinD persistent storage (named volumes).
      - type: volume
        source: dind-docker
        target: /var/lib/docker
      - type: volume
        source: dind-containerd
        target: /var/lib/containerd
      - type: volume
        source: dind-k3s
        target: /var/lib/rancher
    # BIND_IP defaults to 127.0.0.1 so ports are never exposed on the public
    # network by accident. Override to a VPN address (e.g. 10.8.0.5) for
    # team sharing.
    ports:
      - "${BIND_IP:-127.0.0.1}:443:443"
      - "${BIND_IP:-127.0.0.1}:80:80" 
      - "${BIND_IP:-127.0.0.1}:${VNC_PORT:-5800}:5800" # VNC
      - "${BIND_IP:-127.0.0.1}:${DFAI_PORT:-1080}:1080" # DFAI proxy
    # Dev containers must NOT auto-restart — masks /init crashes during
    # postCreateCommand and wipes /tmp on silent restart.
    restart: "no"

networks:
  dev-net:
    driver: bridge

# DinD state survives container recreate. Hard reset:
#   docker volume rm ${COMPOSE_PROJECT_NAME}_dind-docker ...
volumes:
  dind-docker:
  dind-containerd:
  dind-k3s:
