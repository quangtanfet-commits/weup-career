name: CI — Quality Gate

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

# ─── JOBS RUN IN PARALLEL ─────────────────────────────────────
jobs:

  # ── 0. Detect frontend (gate full-stack jobs until frontend exists) ──
  detect:
    name: "Detect frontend"
    runs-on: ubuntu-latest
    outputs:
      has_frontend: ${{ steps.c.outputs.has_frontend }}
      has_e2e_stack: ${{ steps.c.outputs.has_e2e_stack }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          if [ -f frontend/package-lock.json ]; then
            echo "has_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_frontend=false" >> "$GITHUB_OUTPUT"
          fi
          # E2E needs the full Docker stack (frontend + nginx + backend).
          # Until docker-compose.test.yml lands (F2), skip E2E instead of
          # failing — an E2E run with no public pages tests nothing.
          if [ -f docker-compose.test.yml ]; then
            echo "has_e2e_stack=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_e2e_stack=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 0b. Dependency Review (PR-only) ─────────────────────────
  # Blocks PRs that introduce a dependency with a known high-severity
  # vulnerability. The action diffs the PR base…head dependency manifests, so
  # it only runs on pull_request events (it errors on push/schedule with no
  # base/head). Moved here from the weekly security-scan workflow, where it
  # could never succeed. Continuous dependency alerting stays on Dependabot.
  dependency-review:
    name: "📦 Dependency Review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ── 0c. Actions SHA-pin gate (supply-chain, N-6) ────────────
  # Blocks any THIRD-PARTY action referenced without a 40-char commit SHA.
  # Defends against tag-rewrite supply-chain attacks (e.g. tj-actions, 03/2025).
  # Scope + rationale: docs/security/actions-sha-pinning-2026-06.md
  actions-pinning:
    name: "📌 Actions SHA-pin"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce third-party actions pinned to SHA
        run: bash .github/scripts/check-action-pinning.sh

  # ── 1. Backend — Lint & Type Check ──────────────────────────
  lint-backend:
    name: "🔍 Backend Lint & Types"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv pip install --system -e . --group dev

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: mypy strict
        run: mypy app/ --strict --ignore-missing-imports

      - name: Bandit security lint
        run: bandit -ll -r app/

  # ── 2. Frontend — Lint & Type Check ─────────────────────────
  lint-frontend:
    name: "🔍 Frontend Lint & Types"
    runs-on: ubuntu-latest
    # Skip until the frontend is scaffolded (backend-only slices ship first).
    needs: [detect]
    if: ${{ needs.detect.outputs.has_frontend == 'true' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  # ── 3. Backend — Tests & Coverage ───────────────────────────
  test-backend:
    name: "🧪 Backend Tests"
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv

      - name: Cache uv
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml') }}

      - name: Install dependencies
        run: uv pip install --system -e . --group dev

      - name: Run tests with coverage
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production-use
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -v \
            --tb=short

      - name: Critical-layer coverage (NFR-19, == 100%)
        # Tái dùng .coverage do bước trên sinh ra — KHÔNG chạy lại test.
        # Tổng include == 100% ⟺ mọi line+branch trong lớp tới hạn được phủ.
        # Lý do phạm vi: docs/testing/coverage-critical-layers-n2.md
        run: |
          coverage report \
            --include="app/auth/*,app/guardians/*,app/assessments/*,app/reco/*,app/core/consent.py,app/core/crypto.py,app/core/security.py,app/core/audit.py,app/core/authz.py,app/core/ratelimit.py" \
            --fail-under=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4. Frontend — Tests & Coverage ──────────────────────────
  test-frontend:
    name: "🧪 Frontend Tests"
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.has_frontend == 'true' }}
    needs: [detect, lint-frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=verbose

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4b. Storybook build + Chromatic visual regression ───────
  # build-storybook ALWAYS runs (deterministic, no external service) — a broken
  # story or a primitive API drift fails the gate. The Chromatic publish step
  # runs only when CHROMATIC_PROJECT_TOKEN is set (the repo owner provisions it
  # at chromatic.com → project settings); without it, visual regression is a
  # no-op rather than a hard failure. See docs/testing/chromatic.md.
  storybook:
    name: "📚 Storybook + Chromatic"
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.has_frontend == 'true' }}
    needs: [detect, lint-frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic needs full history for baseline diffing

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook (headless gate)
        run: npm run build-storybook

      - name: Publish to Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@d92ea1ce501f70e8c34745b2c7888648150a368a # v17.2.0
        with:
          workingDir: frontend
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          exitZeroOnChanges: false # unapproved visual drift fails the PR

  # ── 5. Security Scan ─────────────────────────────────────────
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Run Semgrep from the PyPI CLI instead of returntocorp/semgrep-action@v1.
      # The container action pulls returntocorp/semgrep-agent from Docker Hub in
      # GitHub's action-setup phase (outside step control), so a transient
      # registry timeout red-X'd the PR with no way to retry it. The CLI drops
      # the Docker Hub dependency; the retry loop below absorbs PyPI/registry
      # flakes while still failing the gate on real findings (exit 1).
      - name: Semgrep SAST
        run: |
          python -m pip install --upgrade pip
          for i in 1 2 3; do
            pip install semgrep && break
            echo "pip install semgrep failed (attempt $i/3); retrying in $((i*5))s…"
            sleep $((i*5))
          done
          set +e
          attempt=0
          while :; do
            attempt=$((attempt+1))
            semgrep scan \
              --config p/python \
              --config p/react \
              --config p/security-audit \
              --config p/secrets \
              --sarif --output semgrep.sarif
            status=$?
            if [ $status -eq 0 ]; then
              echo "Semgrep: no blocking findings."
              break
            elif [ $status -eq 1 ]; then
              echo "::error::Semgrep found blocking findings."
              exit 1
            else
              echo "Semgrep errored (exit $status) on attempt $attempt/3 — likely a registry/network flake, not a finding."
              if [ $attempt -ge 3 ]; then
                echo "::error::Semgrep failed after 3 attempts (infrastructure)."
                exit $status
              fi
              sleep $((attempt*5))
            fi
          done

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()
        continue-on-error: true  # code-scanning upload needs GHAS (private repo)

      - name: Python dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --requirement <(pip install uv && uv pip compile pyproject.toml) \
            --ignore-vuln GHSA-xxxxxxxx || true  # list specific ignored CVEs

      - name: Node dependency audit
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm audit --audit-level high

  # ── 6. TLA+ Formal Verification ─────────────────────────────
  formal-verification:
    name: "🔢 TLA+ Model Check"
    runs-on: ubuntu-latest
    # Only run when TLA+ specs or implementation changes
    steps:
      - uses: actions/checkout@v4

      - name: Check if TLA+ files changed
        id: tla-changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            tla/**/*.tla
            tla/**/*.cfg
            backend/app/auth/**
            backend/app/guardians/**
            backend/app/assessments/**
            backend/app/reco/**
            backend/app/competency/**
            backend/app/core/consent.py
            backend/app/core/audit.py

      - name: Download TLA+ tools
        if: steps.tla-changed.outputs.any_changed == 'true'
        run: |
          wget -q https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            -O /tmp/tla2tools.jar

      - name: Run TLC — tất cả module (CP-1…CP-8)
        if: steps.tla-changed.outputs.any_changed == 'true'
        run: |
          for m in ConsentLifecycle SensitiveDataAccess AuthorizationModel \
                   RecommendationGovernance AuthTokenLifecycle CompetencyProgress; do
            echo "=== TLC: $m ==="
            java -jar /tmp/tla2tools.jar \
              -config "tla/$m.cfg" "tla/${m}MC.tla" 2>&1 | tee "tla-$m.log"
            grep -q "Model checking completed" "tla-$m.log"
          done

  # ── 6b. Bias / [CRED_C5DB6C42] Test (AI fairness) — Luật 134/2025, NFR-12 ───
  bias-test:
    name: "⚖️  Bias / [CRED_C5DB6C42] Test"
    runs-on: ubuntu-latest
    # Chỉ chạy khi đụng engine gợi ý / [CRED_E1311C5D] (kích hoạt khi code xuất hiện)
    steps:
      - uses: actions/checkout@v4

      - name: Check if recommendation/assessment code changed
        id: bias-changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            backend/app/reco/**
            backend/app/assessments/**
            backend/tests/bias/**

      - uses: actions/setup-python@v5
        if: steps.bias-changed.outputs.any_changed == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run bias test suite (HARD GATE — không nới ngưỡng)
        if: steps.bias-changed.outputs.any_changed == 'true'
        working-directory: backend
        run: |
          # Khung: docs/testing/bias-testing.md (M1..M5, DIR≥0.80, counterfactual≥99%)
          if [ ! -d tests/bias ]; then
            echo "❌ P-1: code engine gợi ý/[CRED_E1311C5D] thay đổi nhưng THIẾU bộ bias test (tests/bias/)."
            echo "   Bắt buộc theo NFR-12 + Luật 134/2025. Xem docs/testing/bias-testing.md."
            exit 1
          fi
          pip install uv && uv pip install --system -e . --group dev
          pytest tests/bias/ -v

  # ── 7. E2E Tests (Playwright) ────────────────────────────────
  e2e:
    name: "🎭 E2E Tests — ${{ matrix.browser }}"
    runs-on: ubuntu-latest
    if: ${{ needs.detect.outputs.has_frontend == 'true' && needs.detect.outputs.has_e2e_stack == 'true' }}
    needs: [detect, test-backend, test-frontend]
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build & start Docker stack for E2E
        env:
          SECRET_KEY: ci-e2e-test-secret-not-for-production
          FIELD_ENCRYPTION_KEY: ci-e2e-test-field-encryption-key-not-for-production
          ENVIRONMENT: test
        run: |
          # Shared mailer outbox: the backend (non-root appuser, in-container)
          # writes the N-3 verify token here; the host Playwright step reads the
          # same file via the bind mount. chmod 777 so appuser can create it.
          # See docs/testing/ci-e2e-mailer-outbox-fix-2026-06.md.
          mkdir -p .e2e-outbox && chmod 777 .e2e-outbox
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
          # Wait for health
          timeout 60 bash -c 'until curl -sf http://localhost/api/v1/ready; do sleep 2; done'

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          BASE_URL: http://localhost
          # Same host file the compose backend writes to via /shared. The
          # fixtures honor this env (tests/e2e/fixtures/auth.ts); without it
          # they default to /tmp/weup-outbox.ndjson and never see the token.
          WEUP_MAILER_OUTBOX: ${{ github.workspace }}/.e2e-outbox/outbox.ndjson
        run: npx playwright test --project=${{ matrix.browser }} --reporter=html

      - name: Dump Docker stack logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color --timestamps

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
            .e2e-outbox/outbox.ndjson
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  # ── 8. Container Image Build & Scan ─────────────────────────
  build-and-scan:
    name: "🐳 Build & Scan Images"
    runs-on: ubuntu-latest
    # Needs the frontend image; skip until frontend exists.
    if: ${{ needs.detect.outputs.has_frontend == 'true' }}
    needs: [detect, lint-backend, lint-frontend]
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      frontend-tag: ${{ steps.meta-frontend.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend image metadata
      - name: Backend image metadata
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      # Frontend image metadata
      - name: Frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      # Build backend
      - name: Build backend image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: backend
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:buildcache,mode=max

      # Build frontend
      - name: Build frontend image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: frontend
          target: runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:buildcache,mode=max

      # Trivy: report and gate are split. The report steps (exit-code 0)
      # ALWAYS produce SARIF so the Security tab populates even when the gate
      # below fails. The gate steps fail the build only on ACTIONABLE
      # (fixable) CRITICAL/HIGH vulns — ignore-unfixed drops base-OS CVEs that
      # have no upstream patch yet (not actionable, would block on noise).
      # Both reuse TRIVY_CACHE_DIR, so the vuln DB is downloaded once.

      # Backend — SARIF report (never fails)
      - name: Trivy report — backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:sha-${{ github.sha }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
        if: github.event_name != 'pull_request'

      # Frontend — SARIF report (never fails)
      - name: Trivy report — frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:sha-${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
        if: github.event_name != 'pull_request'

      - name: List Trivy SARIF artifacts
        run: ls -la trivy-*.sarif || echo "no SARIF files produced"
        if: always() && github.event_name != 'pull_request'

      # Visibility only (Security tab); the real gate is the table steps below.
      # Never block a merge on a SARIF-upload hiccup.
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: |
            trivy-backend.sarif
            trivy-frontend.sarif
        continue-on-error: true
        if: always() && github.event_name != 'pull_request'

      # Backend — gate (fails on fixable CRITICAL/HIGH)
      - name: Trivy gate — backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        if: github.event_name != 'pull_request'

      # Frontend — gate (fails on fixable CRITICAL/HIGH)
      - name: Trivy gate — frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:sha-${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        if: github.event_name != 'pull_request'

  # ── 9. PR Summary ─────────────────────────────────────────────
  ci-summary:
    name: "✅ CI Gate — All Passed"
    runs-on: ubuntu-latest
    needs:
      - actions-pinning
      - lint-backend
      - lint-frontend
      - test-backend
      - test-frontend
      - storybook
      - security
      - e2e
      - build-and-scan
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed — PR is mergeable"
