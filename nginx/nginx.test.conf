# nginx reverse proxy for the E2E test stack (docker-compose.test.yml).
#
# Mirrors the production topology (deployment.md): a single edge on :80 routes
# the public site to the Next.js standalone server and the API to the backend.
# This is the host the Playwright E2E suite talks to (BASE_URL=http://localhost)
# and the host CI probes for readiness (http://localhost/api/v1/ready).
#
# TLS is intentionally omitted here — it is terminated by nginx in production
# but is out of scope for the in-CI E2E stack, which runs on plain HTTP :80.

events {}

http {
  # Upstreams resolve via the compose network's embedded DNS by service name.
  upstream frontend {
    server frontend:3000;
  }
  upstream backend {
    server backend:8000;
  }

  server {
    listen 80;
    server_name _;

    # Anonymous public API + app endpoints under /api/* go to the backend.
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else is the Next.js server (RSC public routes + assets).
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
