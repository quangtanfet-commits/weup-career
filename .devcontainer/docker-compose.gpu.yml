# =============================================================================
# weup — GPU overlay (opt-in)
# =============================================================================
# Adds NVIDIA GPU access to the `dev` service. Apply this file ON TOP of
# docker-compose.yml — never alone.
#
# How to enable:
#
#   1) Host prerequisites (one-time):
#        - NVIDIA driver installed on the host (`nvidia-smi` works)
#        - nvidia-container-toolkit installed and configured:
#            https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
#        - Verify:  docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi
#
#   2) Tell the devcontainer.json to use both files. Edit .devcontainer/
#      devcontainer.json and change:
#          "dockerComposeFile": "docker-compose.yml"
#      to:
#          "dockerComposeFile": ["docker-compose.yml", "docker-compose.gpu.yml"]
#
#      For raw `docker compose` from the host:
#          docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#      Or set in .env:
#          COMPOSE_FILE=docker-compose.yml:docker-compose.gpu.yml
#
#   3) (optional) Pin specific GPUs via .env:
#        NVIDIA_VISIBLE_DEVICES=0,1     # only GPU 0 and 1
#        NVIDIA_VISIBLE_DEVICES=all     # default
#        GPU_COUNT=1                    # how many to reserve (must be ≤ visible)
#
# Inside the container after a GPU-enabled start:
#   nvidia-smi                          # should list the GPUs
#   python -c "import torch; print(torch.cuda.is_available())"
#
# Notes:
#   - The image does NOT bake CUDA toolchains by default. Install them on
#     demand inside the container (pip install torch --index-url
#     https://download.pytorch.org/whl/cu124, etc.) or via your post-create
#     hook. The driver mount comes from the host via nvidia-container-toolkit.
#   - DinD (the embedded dockerd) does NOT automatically inherit GPU access.
#     If you need `docker run --gpus all` *inside* the devcontainer, that
#     requires the nvidia runtime to be present inside the embedded dockerd
#     too — out of scope here; document or set up per-project.
# =============================================================================
services:
  dev:
    environment:
      # NVIDIA container runtime reads these. `all` exposes every visible GPU;
      # override via .env to a comma-separated list of indices to restrict.
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    # Compose v2.3+ device-reservation. `count: all` reserves every GPU the
    # host exposes; set GPU_COUNT in .env to limit (e.g. GPU_COUNT=1).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
