# WeUp Career — E2E test stack overlay (architecture.md §11 F2, CI `e2e` job).
#
# Used as: `docker compose -f docker-compose.yml -f docker-compose.test.yml up`.
# It brings up the full public-facing topology the Playwright suite needs:
#
#   nginx (:80)  ──/api/*──▶  backend  (FastAPI, seeded career + content)
#                └──/──────▶  frontend (Next.js standalone, anonymous RSC reads)
#
# The base `docker-compose.yml` already defines `backend`; here we (a) make its
# `.env` optional and inject a throwaway test secret so it boots in CI without a
# committed secrets file, (b) add the Next.js frontend pointed at the backend
# over the compose network, and (c) put nginx in front so the suite has a single
# origin (http://localhost) exactly like production.

services:
  backend:
    # The base service requires ./backend/.env; in CI that file does not exist.
    # Mark it optional and provide the test config inline instead.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Non-production throwaway secrets; CI also exports SECRET_KEY but these
      # guarantee the backend boots from `docker compose` alone. Both keys are
      # required by Settings (Field(min_length=32)) — omitting FIELD_ENCRYPTION_KEY
      # makes pydantic raise at boot, crashing the container before its
      # healthcheck start_period elapses.
      SECRET_KEY: ${SECRET_KEY:-e2e-test-secret-not-for-production-use-only}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:-e2e-test-field-encryption-key-not-for-production}
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      ENVIRONMENT: ${ENVIRONMENT:-test}
      LOG_LEVEL: warning
      # Disable the H-03 app-layer rate limiter for E2E. Behind nginx every
      # request reaches the backend from a single source IP, so the per-IP
      # buckets (register 5/h, login 20/min) exhaust within one suite run and
      # return 429 — which broke the auth-lifecycle flows. Rate-limit behaviour
      # is already covered deterministically by the backend integration tests
      # (tests/integration/test_http_hardening.py), so E2E need not exercise it.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      # N-3 email verification: select FileMailer (deps.py) instead of
      # ConsoleMailer so register/resend write the verify token to an outbox the
      # host Playwright fixtures can read. The path lives on the /shared bind
      # mount below; the CI runner points its own WEUP_MAILER_OUTBOX at the same
      # host dir (./.e2e-outbox), so backend (in-container) and Playwright
      # (on the host) resolve to the SAME file across the two filesystems.
      # See docs/testing/ci-e2e-mailer-outbox-fix-2026-06.md.
      WEUP_MAILER_OUTBOX: /shared/outbox.ndjson
    volumes:
      # Bind mount, not a named volume — the host Playwright step must read this
      # path directly. The runner creates ./.e2e-outbox (chmod 777) before
      # `up` because the container runs as non-root `appuser`.
      - ./.e2e-outbox:/shared
    # No host port needed — nginx reaches it on the internal network. (The base
    # publishes 8000 for dev convenience; that is harmless here.)

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        # NEXT_PUBLIC_* is inlined into the client bundle at BUILD time, so the
        # browser-facing API base must be a build arg (a runtime `environment:`
        # entry is never seen by the client bundle). This is the *origin only*
        # — config.ts appends API_BASE_PATH (`/api/v1`) — so authed browser
        # calls hit `http://localhost/api/v1/*` same-origin and nginx proxies
        # `/api/` to the backend (no cross-origin :8000 hop, no CORS preflight).
        NEXT_PUBLIC_API_BASE_URL: http://localhost
    image: weup-career-frontend:test
    environment:
      NODE_ENV: production
      # Server-only: anonymous RSC reads resolve the backend over the compose
      # network. NEVER shipped to the client bundle (lib/api/config.ts).
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.test.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost/api/v1/ready
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
