[project]
name = "weup-career-backend"
version = "2.0.0"
description = "WeUp Career — Backend API (auth + guardian consent slice)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.118,<0.121",
    "starlette>=0.49.1,<1.3",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "aiosqlite>=0.20,<0.23",
    "alembic>=1.14,<1.15",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.10,<3",
    "bcrypt>=4.2,<5",
    "structlog>=24.4,<26",
    "cryptography>=46.0.5,<47",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.18,<0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=6.0,<8",
    "httpx>=0.28,<0.29",
    "hypothesis>=6.122,<7",
    "mypy>=1.13,<3",
    "ruff>=0.8,<0.16",
    "bandit>=1.8,<2",
    "asgi-lifespan>=2.1,<3",
    "locust>=2.44.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "ASYNC", "RUF"]
ignore = [
    "S101",  # assert used (fine in tests; app code avoids it)
    "B008",  # function call in arg default — required FastAPI Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
# S105/S106/S107: literal "token_type"/test passwords flagged as hardcoded secrets.
"app/auth/schemas.py" = ["S105"]
"tests/**" = ["S105", "S106", "S107", "S311"]
# Bias-metric test filenames are mandated verbatim by docs/testing/bias-testing.md
# (e.g. test_M1_scoring_invariance.py); keep the spec-aligned uppercase metric id.
"tests/bias/test_M*.py" = ["N999"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_decorators = false  # FastAPI/SQLAlchemy decorators are untyped
exclude = ["migrations/"]

# Tests use duck-typed in-memory fakes (structural Protocol subsets) and
# `response.json()` (Any). Keep strict typing on `app/`, relax these in tests.
[[tool.mypy.overrides]]
module = ["tests.*"]
warn_return_any = false
disallow_untyped_defs = false
[[tool.mypy.overrides]]
module = ["tests.unit.test_consent_authz"]
disable_error_code = ["arg-type"]
[[tool.mypy.overrides]]
module = ["tests.unit.test_age_config"]
warn_unused_ignores = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # aiosqlite runs each in-memory connection on a daemon thread. With many
    # async tests churning event loops in one session, finalizing such a
    # connection can surface a benign "Event loop is closed" thread exception
    # (a test-infra artifact of the StaticPool in-memory pattern, not app code).
    # Silence only this specific unhandled-thread warning.
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "migrations/*"]
branch = true
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
