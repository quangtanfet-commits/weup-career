# gitleaks config for WeUp Career (used by scripts/security-scan-native.sh).
#
# We scan the WORKING TREE with `--no-git`, which (unlike a git-history scan)
# does NOT honour .gitignore. The allowlist below therefore re-excludes paths
# that are gitignored and never committed (local secret files, build output) plus
# one intentional test fixture. It does NOT broadly disable secret detection on
# source — a real secret committed to a tracked source file still trips the gate.

[extend]
useDefault = true

[allowlist]
description = "Local-only secret files, build artifacts, and intentional test fixtures"
paths = [
  # Local env files — gitignored, provisioned by deploy-local.sh, never committed.
  '''(^|/)\.env$''',
  '''(^|/)\.env\.[^/]+$''',
  '''\.devcontainer/\.env$''',
  # Next.js build output — gitignored, regenerated on every build.
  '''\.next/''',
  # Storybook static build output — gitignored, regenerated by build-storybook.
  # Minified vendor bundles trip the generic-api-key heuristic (e.g. `.key` in the
  # JSX runtime); these are generated artifacts, never source secrets.
  '''(^|/)storybook-static/''',
  # Generated scan/report artifacts (gitignored) — must not scan our own output.
  '''(^|/)report/''',
  # Authorized pentest evidence (gitignored) — legitimately contains forged/test
  # tokens (alg=none JWTs etc.) captured during R4 testing; not real secrets.
  '''(^|/)\.pentest/''',
]
regexes = [
  # Intentional, well-known test fixtures (tests/conftest.py make_settings()).
  '''test-(secret|field)-key-[0-9a-f]+''',
]
