name: Security — Scheduled Scan

on:
  schedule:
    - cron: "0 2 * * 1"  # Every Monday at 02:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  owasp-zap:
    name: "🛡️ OWASP ZAP Baseline"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Start application stack
        env:
          SECRET_KEY: security-scan-key-not-for-production
          ENVIRONMENT: test
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
          timeout 60 bash -c 'until curl -sf http://localhost/api/v1/ready; do sleep 2; done'

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I"
          fail_action: true
          # The default token has no `issues: write`, so the action's issue
          # filing 500s with "Resource not accessible by integration" and reds
          # the run. Findings still gate the job via `fail_action`.
          allow_issue_writing: false

      - name: Stop application stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  codeql:
    name: "🔬 CodeQL Analysis"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Build
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
